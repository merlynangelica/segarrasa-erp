<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">

</div>
<div id="app" class="app-shell hidden">

 <div class="nav-label">WORKSPACE</div><nav id="nav">

 </main>
</div>
